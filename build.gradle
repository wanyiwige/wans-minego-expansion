plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = 'cn.wanyiwige.minego'
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Opt-in headless verification; never included in a normal release build.
if (project.hasProperty('biomeVerification')) {
    sourceSets.main.java.srcDir('audit/dev-validation-src')
    sourceSets.main.resources.srcDir('audit/dev-validation-resources')
}
if (project.hasProperty('epochVerification')) {
    sourceSets.main.java.srcDir('audit/epoch-verification-src')
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
}

repositories {
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('local:irons_spellbooks:3.16.3')
    implementation fg.deobf('local:curios-forge:5.14.1')
    compileOnly fg.deobf('local:jei:15.56.0.205')
    compileOnly fg.deobf('local:emi:1.1.24')
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') { expand props }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
